name: Live supply-chain evidence (manual)

on:
  workflow_dispatch:
    inputs:
      operation:
        description: "Plan verification identities only, or verify an existing digest-pinned OCI artifact"
        type: choice
        required: true
        default: plan
        options:
          - plan
          - verify
      oci_ref:
        description: "Digest-pinned OCI reference: oci://registry/repository@sha256:<64-hex>"
        type: string
        required: true
      certificate_identity:
        description: "Exact Fulcio certificate identity expected from Cosign verification"
        type: string
        required: true
      certificate_oidc_issuer:
        description: "Exact OIDC issuer expected from Cosign verification"
        type: string
        required: true
      release_runner_ref:
        description: "Deployment-owned identity of the attested release-verification runner"
        type: string
        required: true
      cosign_digest:
        description: "For verify: SHA-256 of the pinned Cosign verifier binary (sha256:<64-lowercase-hex>)"
        type: string
        required: false
        default: ""
      use_runner_docker_config:
        description: "Use root-owned /etc/morn/registry-auth as DOCKER_CONFIG for private registry verification"
        type: boolean
        required: true
        default: false
      acknowledge_verify_only:
        description: "Required for verify: this verifies existing signature/provenance only; it does not publish, sign, admit a site, or authorize production"
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: live-supply-chain-evidence-${{ github.ref }}
  cancel-in-progress: false

jobs:
  supply-chain-evidence:
    name: Supply chain ${{ inputs.operation }}
    runs-on: ${{ inputs.operation == 'verify' && 'morn-attested-release' || 'ubuntu-latest' }}
    timeout-minutes: 20
    env:
      INPUT_OPERATION: ${{ inputs.operation }}
      INPUT_OCI_REF: ${{ inputs.oci_ref }}
      INPUT_CERTIFICATE_IDENTITY: ${{ inputs.certificate_identity }}
      INPUT_CERTIFICATE_OIDC_ISSUER: ${{ inputs.certificate_oidc_issuer }}
      INPUT_RELEASE_RUNNER_REF: ${{ inputs.release_runner_ref }}
      INPUT_COSIGN_DIGEST: ${{ inputs.cosign_digest }}
      INPUT_USE_DOCKER_CONFIG: ${{ inputs.use_runner_docker_config }}
      INPUT_ACK_VERIFY_ONLY: ${{ inputs.acknowledge_verify_only }}
      MORN_OCI_REF: ${{ inputs.oci_ref }}
      MORN_COSIGN_CERTIFICATE_IDENTITY: ${{ inputs.certificate_identity }}
      MORN_COSIGN_OIDC_ISSUER: ${{ inputs.certificate_oidc_issuer }}
      MORN_COSIGN_COMMAND: /usr/local/bin/cosign

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate verification identities
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/live-supply-chain-evidence
          python - <<'PY'
          import json, os, pathlib, re

          oci = os.environ["INPUT_OCI_REF"].strip()
          identity = os.environ["INPUT_CERTIFICATE_IDENTITY"].strip()
          issuer = os.environ["INPUT_CERTIFICATE_OIDC_ISSUER"].strip()
          runner_ref = os.environ["INPUT_RELEASE_RUNNER_REF"].strip()
          operation = os.environ["INPUT_OPERATION"]
          digest = os.environ.get("INPUT_COSIGN_DIGEST", "").strip()

          if not re.fullmatch(r"oci://[^\s@]+@sha256:[0-9a-fA-F]{64}", oci):
              raise SystemExit("oci_ref must be a digest-pinned oci://...@sha256:<64-hex> reference")
          if not identity or any(ord(ch) < 32 for ch in identity):
              raise SystemExit("certificate_identity must be a non-empty single-line value")
          if not issuer.startswith("https://") or any(ord(ch) < 32 for ch in issuer):
              raise SystemExit("certificate_oidc_issuer must be an explicit https:// issuer")
          if not runner_ref or any(ord(ch) < 32 for ch in runner_ref):
              raise SystemExit("release_runner_ref must be a non-empty single-line value")
          if operation == "verify":
              if os.environ["INPUT_ACK_VERIFY_ONLY"] != "true":
                  raise SystemExit("verify requires acknowledge_verify_only=true")
              if not re.fullmatch(r"sha256:[0-9a-f]{64}", digest):
                  raise SystemExit("verify requires canonical cosign_digest sha256:<64-lowercase-hex>")

          plan = {
              "gate": "MORN_SUPPLY_CHAIN_VERIFICATION_PLAN",
              "status": "PLANNED",
              "operation": operation,
              "oci_ref": oci,
              "certificate_identity": identity,
              "certificate_oidc_issuer": issuer,
              "release_runner_ref": runner_ref,
              "cosign_digest": digest or None,
              "claims": {
                  "artifact_published": False,
                  "signature_verified": False,
                  "slsa_provenance_verified": False,
                  "site_admitted": False,
                  "production_write": False,
              },
          }
          pathlib.Path("target/live-supply-chain-evidence/verification-plan.json").write_text(
              json.dumps(plan, indent=2), encoding="utf-8"
          )
          PY

      - name: Stop after planning
        if: inputs.operation == 'plan'
        shell: bash
        run: |
          echo "Verification plan emitted. No registry access or Cosign execution occurred."

      - name: Bind verification to attested release runner and pinned Cosign
        if: inputs.operation == 'verify'
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, os, pathlib, stat

          identity_file = pathlib.Path("/etc/morn/release-runner-ref")
          if not identity_file.exists():
              raise SystemExit("release runner is missing /etc/morn/release-runner-ref")
          st = identity_file.lstat()
          if stat.S_ISLNK(st.st_mode) or not stat.S_ISREG(st.st_mode):
              raise SystemExit("release runner identity must be a regular non-symlink file")
          if st.st_uid != 0 or st.st_mode & (stat.S_IWGRP | stat.S_IWOTH):
              raise SystemExit("release runner identity must be root-owned and not group/world writable")
          actual_runner = identity_file.read_text(encoding="utf-8").strip()
          expected_runner = os.environ["INPUT_RELEASE_RUNNER_REF"].strip()
          if actual_runner != expected_runner:
              raise SystemExit(
                  f"release runner identity mismatch: expected {expected_runner!r}, got {actual_runner!r}"
              )

          cosign = pathlib.Path("/usr/local/bin/cosign")
          if not cosign.exists():
              raise SystemExit("pinned Cosign binary is missing at /usr/local/bin/cosign")
          cs = cosign.lstat()
          if stat.S_ISLNK(cs.st_mode) or not stat.S_ISREG(cs.st_mode):
              raise SystemExit("Cosign verifier must be a regular non-symlink file")
          if cs.st_uid != 0 or cs.st_mode & (stat.S_IWGRP | stat.S_IWOTH):
              raise SystemExit("Cosign verifier must be root-owned and not group/world writable")
          digest = "sha256:" + hashlib.sha256(cosign.read_bytes()).hexdigest()
          if digest != os.environ["INPUT_COSIGN_DIGEST"]:
              raise SystemExit(
                  f"Cosign verifier digest mismatch: expected {os.environ['INPUT_COSIGN_DIGEST']}, got {digest}"
              )

          report = {
              "gate": "MORN_ATTESTED_RELEASE_RUNNER_BINDING",
              "status": "PASS",
              "release_runner_ref": actual_runner,
              "cosign_digest": digest,
              "runner_name": os.environ.get("RUNNER_NAME"),
              "runner_os": os.environ.get("RUNNER_OS"),
              "runner_arch": os.environ.get("RUNNER_ARCH"),
              "github_run_id": os.environ.get("GITHUB_RUN_ID"),
              "github_sha": os.environ.get("GITHUB_SHA"),
              "claims": {
                  "runner_identity_bound": True,
                  "verifier_binary_pinned": True,
                  "artifact_published": False,
                  "signature_verified": False,
                  "slsa_provenance_verified": False,
                  "site_admitted": False,
                  "production_write": False,
              },
          }
          pathlib.Path("target/live-supply-chain-evidence/runner-binding.json").write_text(
              json.dumps(report, indent=2), encoding="utf-8"
          )
          PY

      - name: Configure optional deployment-owned registry credentials
        if: inputs.operation == 'verify' && inputs.use_runner_docker_config
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os, pathlib, stat

          path = pathlib.Path("/etc/morn/registry-auth")
          if not path.exists() or not path.is_dir() or path.is_symlink():
              raise SystemExit("/etc/morn/registry-auth must be a real directory")
          st = path.stat()
          if st.st_uid != 0 or st.st_mode & (stat.S_IRWXG | stat.S_IRWXO):
              raise SystemExit("/etc/morn/registry-auth must be root-owned with no group/world permissions")
          config = path / "config.json"
          if not config.exists() or config.is_symlink() or not config.is_file():
              raise SystemExit("/etc/morn/registry-auth/config.json must be a regular non-symlink file")
          cs = config.stat()
          if cs.st_uid != 0 or cs.st_mode & (stat.S_IRWXG | stat.S_IRWXO):
              raise SystemExit("registry config must be root-owned with no group/world permissions")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as fh:
              fh.write("DOCKER_CONFIG=/etc/morn/registry-auth\n")
              fh.write("MORN_COSIGN_ENV_PASSTHROUGH=DOCKER_CONFIG\n")
          PY

      - name: Verify exact signature and SLSA provenance
        if: inputs.operation == 'verify'
        shell: bash
        run: |
          set -euo pipefail
          cargo run --quiet -p morn-app --bin supply_chain_verify             | tee target/live-supply-chain-evidence/verification-report.json

      - name: Export Morn-loadable supply-chain evidence
        if: inputs.operation == 'verify'
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, pathlib
          path = pathlib.Path("target/live-supply-chain-evidence/verification-report.json")
          report = json.loads(path.read_text(encoding="utf-8"))
          if report.get("status") != "PASS":
              raise SystemExit("supply-chain verification did not PASS")
          evidence = report.get("verification_evidence")
          if not isinstance(evidence, dict):
              raise SystemExit("PASS report is missing verification_evidence")
          if not evidence.get("signature_verified") or not evidence.get("provenance_verified"):
              raise SystemExit("verification evidence did not prove both required trust axes")
          pathlib.Path("target/live-supply-chain-evidence/supply-chain-verification.json").write_text(
              json.dumps(evidence, indent=2), encoding="utf-8"
          )
          PY

      - name: Upload evidence reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-supply-chain-evidence-${{ github.sha }}-${{ inputs.operation }}
          path: target/live-supply-chain-evidence
          if-no-files-found: warn
          retention-days: 30
