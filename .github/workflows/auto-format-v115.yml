name: Auto Format v11.5

on:
  push:
    branches:
      - feat/v11.5-control-plane-convergence
    paths:
      - "crates/**/*.rs"
      - ".github/workflows/auto-format-v115.yml"

permissions:
  contents: write

jobs:
  rustfmt:
    if: ${{ !contains(github.event.head_commit.message, 'style: cargo fmt v11.5') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/v11.5-control-plane-convergence
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Format Rust workspace
        run: cargo fmt --all
      - name: Commit formatting only
        run: |
          if git diff --quiet; then
            echo "No formatting changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 'crates/**/*.rs'
          git commit -m "style: cargo fmt v11.5 [skip ci]"
          git push origin HEAD:feat/v11.5-control-plane-convergence
