name: CI

on:
  push:
    branches: [main, morn-v1, "**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (fmt / clippy / tests / zero-domain)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: No UTF-8 BOM in tracked text files
        shell: pwsh
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/check_no_bom.ps1
      - name: Install Tauri Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build frontend assets (required by tauri generate_context!)
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - name: cargo fmt --check
        run: cargo fmt --all -- --check
      - name: cargo clippy (-D warnings)
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: cargo test (workspace, all features)
        run: cargo test --workspace --all-features
      - name: Domain boundary guard
        shell: pwsh
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/check_domain_boundary.ps1
      - name: Zero-domain Core build (no domain packs)
        run: cargo check -p morn-app
      - name: "Core tests (zero-domain: migration/security/chaos/conformance/pure-core E2E)"
        run: cargo test -p morn-core-tests
      - name: Developer CLI smoke
        shell: pwsh
        run: |
          cargo build -p morn-cli
          $cli = Join-Path $PWD "target/debug/morn"
          foreach ($c in @("doctor","status","provider","connector list","connector health","plugin validate","compat","migrate status","node list","domain list","package inspect","conformance")) {
            $parts = $c -split " "
            & $cli @parts | Out-Null
            if ($LASTEXITCODE -ne 0) { throw "morn $c failed" }
          }
          Write-Host "CLI smoke OK"

  composition-runtime:
    name: Composition runtime (Cordis)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: runtime/cordis-host
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install exact-pinned Cordis host
        run: npm install --ignore-scripts --no-audit --no-fund
      - run: npm test
      - run: npm run smoke

  frontend:
    name: Frontend (typecheck / lint / test / build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  e2e-smoke:
    name: E2E (server + BioLab + Playwright UI smoke)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend deps
        working-directory: frontend
        run: npm ci
      - name: Install Playwright Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Build all-features server
        run: cargo build -p morn-app --bin server --all-features
      - name: Demo smoke (health / bootstrap / BioLab E2E / workbench)
        run: |
          set -euo pipefail
          export MORN_DB="$PWD/target/ci_smoke.db" MORN_PORT=8090
          ./target/debug/server &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:8090/api/health 2>/dev/null | grep -q '"status":"ok"'; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8090/api/health | grep -q '"status":"ok"'
          curl -fsS -X POST http://127.0.0.1:8090/api/demo/bootstrap | grep -q '"objects":1'
          curl -fsS -X POST http://127.0.0.1:8090/api/biolab/run | grep -q '"all_ok":true'
          curl -fsS http://127.0.0.1:8090/api/workbench | grep -q '"world_objects"'
          echo "demo smoke OK"
      - name: UI smoke (Playwright, four surfaces + BioLab)
        working-directory: frontend
        run: |
          set -euo pipefail
          export MORN_DB="$PWD/../target/ci_ui_smoke.db" MORN_PORT=8090
          ../target/debug/server &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:8090/api/health 2>/dev/null | grep -q '"status":"ok"'; then break; fi
            sleep 1
          done
          npx vite --host 127.0.0.1 --port 5173 --strictPort &
          VITE_PID=$!
          trap 'kill $VITE_PID $SERVER_PID 2>/dev/null || true' EXIT
          for i in $(seq 1 60); do
            if curl -fsS -o /dev/null http://127.0.0.1:5173/ 2>/dev/null; then break; fi
            sleep 1
          done
          export UI_SCREENSHOT_DIR="$PWD/../artifacts/ci-ui-screenshots"
          node scripts/ui_smoke.mjs
      - name: Upload four-surface visual evidence (fixture only)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: morn-ui-reference-${{ github.sha }}
          path: artifacts/ci-ui-screenshots
          if-no-files-found: warn
          retention-days: 14

  desktop:
    name: Desktop (Tauri build)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Build Tauri desktop shell
        shell: pwsh
        working-directory: .
        run: cargo build -p morn-desktop
      - name: Build Windows reference backend
        shell: pwsh
        working-directory: .
        run: cargo build -p morn-app --bin server --all-features
      - name: Publish unsigned Windows reference bundle
        uses: actions/upload-artifact@v4
        with:
          name: morn-windows-reference-${{ github.sha }}
          path: |
            target/debug/morn-desktop.exe
            target/debug/server.exe
          if-no-files-found: error
          retention-days: 14
