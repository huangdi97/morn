[workspace]
resolver = "2"
members = [
    "crates/morn-kernel",
    "crates/morn-world",
    "crates/morn-artifact",
    "crates/morn-capability",
    "crates/morn-harness",
    "crates/morn-runtime",
    "crates/morn-actor",
    "crates/morn-organization",
    "crates/morn-work",
    "crates/morn-evolution",
    "crates/morn-foundry",
    "crates/morn-assurance",
    "crates/morn-opint",
    "crates/morn-integration",
    "crates/morn-process",
    "crates/morn-node",
    "crates/morn-domain-sdk",
    "crates/morn-package",
    "crates/morn-profile",
    "crates/morn-control-plane",
    "crates/morn-cli",
    "crates/morn-core-tests",
    "domain-packs/biolab-reference",
    "crates/morn-store",
    "crates/morn-app",
    "src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["Morn Project"]

[workspace.dependencies]
morn-kernel = { path = "crates/morn-kernel" }
morn-world = { path = "crates/morn-world" }
morn-artifact = { path = "crates/morn-artifact" }
morn-capability = { path = "crates/morn-capability" }
morn-harness = { path = "crates/morn-harness" }
morn-runtime = { path = "crates/morn-runtime" }
morn-actor = { path = "crates/morn-actor" }
morn-organization = { path = "crates/morn-organization" }
morn-work = { path = "crates/morn-work" }
morn-evolution = { path = "crates/morn-evolution" }
morn-foundry = { path = "crates/morn-foundry" }
morn-assurance = { path = "crates/morn-assurance" }
morn-opint = { path = "crates/morn-opint" }
morn-integration = { path = "crates/morn-integration" }
morn-process = { path = "crates/morn-process" }
morn-node = { path = "crates/morn-node" }
morn-domain-sdk = { path = "crates/morn-domain-sdk" }
morn-package = { path = "crates/morn-package" }
morn-profile = { path = "crates/morn-profile" }
morn-control-plane = { path = "crates/morn-control-plane" }
morn-cli = { path = "crates/morn-cli" }
morn-core-tests = { path = "crates/morn-core-tests" }
morn-biolab-reference = { path = "domain-packs/biolab-reference" }
morn-store = { path = "crates/morn-store" }
morn-app = { path = "crates/morn-app" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
rusqlite = { version = "0.32", features = ["bundled"] }
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
axum = "0.7"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.5", features = ["cors", "trace"] }
sha2 = "0.10"

[profile.release]
lto = "thin"
